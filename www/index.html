<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d0b; --ink:#f4ecd8;
  --gold:#d8b45a; --sub:#b9ad92;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100vh;color:var(--ink);background:
   radial-gradient(60% 40% at 25% 38%,rgba(216,180,90,.28),transparent 70%),
   radial-gradient(60% 40% at 78% 40%,rgba(216,180,90,.18),transparent 70%),
   radial-gradient(120% 80% at 50% 0%,#24211a,var(--bg) 70%);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
main{max-width:760px;margin:0 auto;padding:54px 14px 40px}
h1,h2{font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{text-align:center;font-size:clamp(3rem,14vw,5rem);line-height:1;color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 30px rgba(216,180,90,.35)}
.credit{text-align:center;margin-top:10px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:12px;letter-spacing:.04em;color:var(--gold);opacity:.75}
.rule{display:flex;align-items:center;gap:10px;margin:12px auto 40px;max-width:260px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{transform:scaleX(-1)}
.rule i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.row{display:flex;gap:14px}
.card{
  flex:1 1 0;min-width:0;padding:9px;border-radius:16px;
  background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.05) 45%,rgba(255,255,255,.14));
  border:1px solid rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.2),0 18px 40px rgba(0,0,0,.55);
}
.inner{
  aspect-ratio:1/1.1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;
  background:linear-gradient(180deg,rgba(20,18,14,.72),rgba(10,9,7,.86));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 0 24px rgba(0,0,0,.6);
}
.inner svg{width:76%;height:auto;display:block;filter:drop-shadow(0 10px 12px rgba(0,0,0,.6))}
.inner h2{margin-top:10px;font-size:clamp(1.4rem,6.5vw,2.1rem);line-height:1;color:var(--ink)}
.inner p{margin:4px 0 0;font-style:italic;font-weight:500;font-size:clamp(.9rem,3.6vw,1.1rem);color:var(--sub)}

.card{cursor:pointer;transition:transform .2s ease}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
.viewer.open{display:flex}
.vbar{display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:rgba(20,18,14,.95);border-bottom:1px solid rgba(255,255,255,.25)}
.vbar button{font:600 1rem "Outfit",system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:7px 16px;cursor:pointer}
.vbar button:focus-visible{outline:2px solid var(--gold)}
.viewer iframe{flex:1;width:100%;border:0;background:#fff}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

.panel{margin-top:22px;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 30px rgba(0,0,0,.45)}
.panel h3{margin:0 0 4px;font:600 1.25rem "Outfit",system-ui,sans-serif}
.panel .note{margin:0 0 12px;color:var(--sub);font-size:1rem;font-style:italic}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.12)}
.srow b{flex:1;font:500 1.05rem "Outfit",system-ui,sans-serif}
.srow time{font:500 .95rem "Outfit",system-ui,sans-serif;color:var(--sub);min-width:3.4em;text-align:right}
.srow small{font-size:.95rem;color:var(--sub);min-width:7.5em;text-align:right}
.badge{font:600 .8rem "Outfit",system-ui,sans-serif;padding:3px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:var(--sub)}
.badge.on{background:var(--gold);color:#241a05;border-color:var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);min-width:0}
.tile span{display:block;color:var(--sub);font-size:.95rem}
.tile output,.tile input{display:block;width:100%;margin-top:2px;font:600 1.15rem "Outfit",system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.25);padding:2px 0;outline:0}
.tile output{border-bottom-color:transparent}
.tile input:focus{border-bottom-color:var(--gold)}
.tile em{font-style:normal;font-size:.85rem;color:var(--sub)}
.nrow{padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font:500 1rem "Outfit",system-ui,sans-serif}
.nrow small{display:block;color:var(--sub);font-size:.85rem}
.panel a{color:var(--gold)}
.sum{margin:0 0 6px;font:600 1rem "Outfit",system-ui,sans-serif;color:var(--gold)}
.chg{font-weight:600;margin-left:4px}
.clock{margin:10px 0 0;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);text-align:center;font:500 .85rem "Outfit",system-ui,sans-serif;color:var(--sub);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1>Journal</h1>
  <div class="credit">Prepared by M.gholizadeh &amp; M.roshangar</div>
  <div class="rule"><i></i></div>
  <div class="row">

    <section class="card" aria-label="Crypto" role="link" tabindex="0" data-page="crypto"><div class="inner">
      <svg viewBox="0 0 100 100" role="img" aria-label="Bitcoin">
        <defs>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a6"/><stop offset=".5" stop-color="#d89a2b"/><stop offset="1" stop-color="#8a5a10"/></linearGradient>
          <linearGradient id="face" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f0b43c"/><stop offset="1" stop-color="#ffd978"/></linearGradient>
        </defs>
        <circle cx="50" cy="50" r="47" fill="url(#rim)"/>
        <circle cx="50" cy="50" r="43" fill="none" stroke="#7a4d0a" stroke-opacity=".6" stroke-dasharray="1.6 2.2" stroke-width="2"/>
        <circle cx="50" cy="50" r="38" fill="url(#face)" stroke="#8a5a10" stroke-opacity=".7" stroke-width="1"/>
        <g fill="none" stroke="#6b430a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(.8 1)" opacity=".5">
          <path d="M40 31V69M40 31H54a9.5 9.5 0 0 1 0 19H40M40 50H56a9.5 9.5 0 0 1 0 19H40M47 23V31M55 23V31M47 69V77M55 69V77"/>
        </g>
        <g fill="none" stroke="#fff6dc" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M40 31V69M40 31H54a9.5 9.5 0 0 1 0 19H40M40 50H56a9.5 9.5 0 0 1 0 19H40M47 23V31M55 23V31M47 69V77M55 69V77"/>
        </g>
        <path d="M18 34A36 36 0 0 1 48 14" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h2>Crypto</h2>
      <p>Bitcoin</p>
    </div></section>

    <section class="card" aria-label="Forex" role="link" tabindex="0" data-page="forex"><div class="inner">
      <svg viewBox="0 0 100 100" role="img" aria-label="Gold bar">
        <defs>
          <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3bd"/><stop offset=".5" stop-color="#f3cd5a"/><stop offset="1" stop-color="#e0a928"/></linearGradient>
          <linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b57d0e"/><stop offset=".25" stop-color="#f6cf5c"/><stop offset=".55" stop-color="#d9a21b"/><stop offset="1" stop-color="#9a6a0a"/></linearGradient>
          <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        </defs>
        <polygon points="14,56 86,56 95,78 5,78" fill="url(#gf)"/>
        <polygon points="14,56 86,56 95,78 5,78" fill="url(#gs)"/>
        <polygon points="27,32 73,32 86,56 14,56" fill="url(#gt)"/>
        <polygon points="32,37 68,37 78,51 22,51" fill="#c99219" fill-opacity=".35" stroke="#fff3bd" stroke-opacity=".7" stroke-width="1"/>
        <path d="M14 56H86" stroke="#fff" stroke-opacity=".8" stroke-width="1.4"/>
        <path d="M27 32H73" stroke="#fff" stroke-opacity=".9" stroke-width="1.2"/>
        <text x="50" y="46" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="7" letter-spacing="1" fill="#6b430a">FINE GOLD</text>
        <text x="50" y="70" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="10" letter-spacing="1" fill="#5c3a06" fill-opacity=".85">999.9</text>
      </svg>
      <h2>Forex</h2>
      <p>Gold</p>
    </div></section>

  </div>

  <section class="panel" aria-label="Forex sessions">
    <h3>Forex sessions</h3>
    <p class="sum" id="sum"></p>
    <div id="sess"></div>
    <p class="clock" id="clock" aria-label="Current time"></p>
  </section>

  <section class="panel" aria-label="Prices">
    <h3>Prices</h3>
    <p class="note">No source connected yet.</p>
  </section>

  <section class="panel" aria-label="High-impact news">
    <h3>High-impact news</h3>
    <p class="note" id="nnote">Loading economic calendar&hellip;</p>
    <div id="news"></div>
  </section>
</main>
<div class="viewer" id="viewer" aria-hidden="true">
  <div class="vbar"><button type="button" id="back">&larr; Journal</button></div>
  <iframe id="frame" title="Journal page"></iframe>
</div>
<script type="application/json" id="pages">{"crypto":"<!doctype html>\n<html lang=\"fa\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>CryptoJournal Pro<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#080c16;--card:#0f1628;--bd:#1c2640;--tx:#e8ecf5;--mu:#8793ab;--ac:#4f8cff;--up:#22c55e;--dn:#ef4444;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}\n:root[data-theme=\"light\"]{--bg:#f3f5f9;--card:#fff;--bd:#dfe4ee;--tx:#131a2b;--mu:#667085;color-scheme:light}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Vazirmatn,system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:16px 16px 96px}\nh1{font-size:21px;margin:6px 0 12px}h2{font-size:14px;color:var(--mu);margin:0 0 8px}\n.card,.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}\n.tile{padding:10px 12px;margin:0}.tile small{display:block;color:var(--mu);font-size:12px}.tile b{font-size:17px}\n.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}\n.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}.sp{flex:1}\n.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.n{direction:ltr;unicode-bidi:isolate;display:inline-block}\nlabel{font-size:12px;color:var(--mu)}\ninput,select,textarea,button{font:inherit;font-size:16px}\ninput,select,textarea{width:100%;margin-top:3px;padding:8px 10px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px}\nbutton{border:0;border-radius:10px;padding:8px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}\nbutton.ghost{background:none;color:var(--mu);border:1px solid var(--bd)}\n.tag{font-size:12px;padding:0 8px;border:1px solid currentColor;border-radius:99px}\n.nt{margin:6px 0 0;font-size:13px;white-space:pre-wrap}\n.ch{width:100%;height:150px;display:block}\n.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}\n.day{min-height:52px;border:1px solid var(--bd);border-radius:8px;padding:3px 4px;font-size:11px;overflow:hidden}.day small{color:var(--mu);display:block}\n.day.g{background:rgba(34,197,94,.16)}.day.r{background:rgba(239,68,68,.16)}.wd{text-align:center;color:var(--mu);font-size:11px}\nnav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}\nnav button{flex:1;background:none;color:var(--mu);font-size:12px;padding:4px;display:flex;flex-direction:column;align-items:center}\nnav button.on{color:var(--ac)}nav span{font-size:18px}\n@media(min-width:760px){body{display:flex}nav{position:sticky;top:0;align-self:flex-start;height:100vh;width:190px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-inline-end:1px solid var(--bd);padding:16px 10px}nav button{flex:0;flex-direction:row;gap:10px;font-size:15px;padding:10px}main{flex:1;padding-bottom:24px}.grid{grid-template-columns:repeat(4,1fr)}}\n<\/style>\n<\/head>\n<body>\n<nav id=\"nav\"><\/nav>\n<main id=\"app\"><\/main>\n<script>\nconst K='cjp-v1',$=s=>document.querySelector(s);\nlet S={trades:[],bal:10000,lang:'fa',theme:'dark'};\ntry{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}\nconst U={view:'dash',m:new Date().toISOString().slice(0,7),q:'',fs:'',edit:null,csv:''};\nconst save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};\nconst D={\nfa:{dash:'داشبورد',trades:'معاملات',cal:'تقویم',set:'تنظیمات',bal:'موجودی',net:'سود/زیان خالص',wr:'Win Rate',pf:'Profit Factor',ravg:'میانگین R', tton data-page=\"risk\">◈ <span data-i18n=\"risk\">مدیریت ریسک<\/span><\/button>\n  <button data-page=\"analytics\">▥ <span data-i18n=\"analytics\">تحلیل عملکرد<\/span><\/button>\n  <button data-page=\"calendar\">▦ <span data-i18n=\"calendar\">تقویم معاملاتی<\/span><\/button>\n  <button data-page=\"settings\">⚙ <span data-i18n=\"settings\">تنظیمات<\/span><\/button>\n <\/nav>\n <div class=\"sidefoot\">ForexJournal · MVP<br>Local-first trading journal<\/div>\n<\/aside>\n<main>\n <header class=\"top\"><div><h1 id=\"pageTitle\">داشبورد<\/h1><div class=\"sub\" id=\"subtitle\">نمای کلی عملکرد معاملاتی شما<\/div><\/div><div class=\"actions\"><button onclick=\"openTrade()\" class=\"primary\" data-i18n=\"newTrade\">+ معامله جدید<\/button><button onclick=\"exportCSV()\">↓ CSV<\/button><button onclick=\"document.getElementById('importFile').click()\">↑ Import<\/button><input id=\"importFile\" type=\"file\" accept=\".csv,text/csv\" class=\"hidden\" onchange=\"importCSV(event)\"><\/div><\/header>\n <section id=\"dashboard\" class=\"section active\">\n  <div class=\"cards\" id=\"metrics\"><\/div>\n  <div class=\"panel\" id=\"liveSessions\" style=\"margin-bottom:14px\">\n   <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px\">\n    <h3 style=\"margin:0\">🌍 Live Forex Sessions<\/h3>\n    <span class=\"muted\" id=\"sessionClock\" style=\"font-size:11px\">در حال به‌روزرسانی...<\/span>\n   <\/div>\n   <div id=\"sessionCards\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px\"><\/div>\n   <div id=\"sessionOverlap\" class=\"notice\" style=\"margin:12px 0 0\">وضعیت هم‌پوشانی سشن‌ها<\/div>\n   <div class=\"muted\" style=\"font-size:10px;margin-top:8px\">ساعت‌ها بر اساس منطقه زمانی هر بازار و با احتساب تغییرات DST محاسبه می‌شوند. ساعات نمایش‌داده‌شده، ساعات رایج بازار فارکس هستند.<\/div>\n  <\/div>\n  <div class=\"grid2\"><div class=\"panel\"><h3 data-i18n=\"equityCurve\">منحنی موجودی (Equity Curve)<\/h3><canvas id=\"equityChart\" class=\"chart\"><\/canvas><\/div><div class=\"panel\"><h3 data-i18n=\"winLoss\">توزیع برد و باخت<\/h3><canvas id=\"winChart\" class=\"chart\"><\/canvas><div id=\"winLegend\" class=\"muted\" style=\"display:flex;justify-content:space-around\"><\/div><\/div><\/div>\n  <div class=\"panel\"><h3 data-i18n=\"recent\">معاملات اخیر<\/h3><div id=\"recentTrades\"><\/div><\/div>\n <\/section>\n <section id=\"trades\" class=\"section\">\n  <div class=\"toolbar\"><input id=\"searchTrade\" placeholder=\"جست‌وجوی نماد یا استراتژی...\" oninput=\"renderTrades()\"><select id=\"filterSide\" onchange=\"renderTrades()\"><option value=\"\">همه جهت‌ها<\/option><option>Buy<\/option><option>Sell<\/option><\/select><select id=\"filterStatus\" onchange=\"renderTrades()\"><option value=\"\">همه وضعیت‌ها<\/option><option>Closed<\/option><option>Open<\/option><\/select><input id=\"fromDate\" type=\"date\" onchange=\"renderTrades()\"><input id=\"toDate\" type=\"date\" onchange=\"renderTrades()\"><\/div>\n  <div class=\"panel\"><div id=\"tradesTable\"><\/div><\/div>\n <\/section>\n <section id=\"risk\" class=\"section\">\n  <div class=\"notice\">محاسبه‌گر حجم و ریسک برای برآورد اولیه است. ارزش پیپ و مشخصات قرارداد در بروکرها متفاوت است؛ مقدار Pip Value را مطابق مشخصات نماد و ارز حساب خود وارد کنید.<\/div>\n  <div class=\"grid2\"><div class=\"panel\"><h3 data-i18n=\"positionCalc\">محاسبه حجم معامله<\/h3><div class=\"fieldgrid\">\n   <div class=\"field\"><label>Balance ($)<\/label><input id=\"rBalance\" type=\"number\" value=\"10000\"><\/div><div class=\"field\"><label>Risk (%)<\/label><input id=\"rPercent\" type=\"number\" value=\"1\" step=\".1\"><\/div><div class=\"field\"><label>Stop Loss (pips)<\/label><input id=\"rStop\" type=\"number\" value=\"30\"><\/div><div class=\"field\"><label>Pip Value / lot ($)<\/label><input id=\"rPip\" type=\"number\" value=\"10\"><\/div><div class=\"field\"><label>Lot increment<\/label><select id=\"rStep\"><option value=\".01\">0.01<\/option><option value=\".1\">0.10<\/option><option value=\"1\">1.00<\/option><\/select><\/div><\/div><button class=\"primary\" style=\"margin-top:14px\" onclick=\"calcRisk()\">محاسبه حجم<\/button><div id=\"riskResult\" style=\"margin-top:15px\"><\/div><\/div>\n  <div class=\"panel\"><h3>حدود ریسک روزانه<\/h3><div class=\"field\"><label>Daily loss limit (%)<\/label><input id=\"dailyLimit\" type=\"number\" value=\"3\"><\/div><div id=\"dailyRisk\" style=\"margin-top:15px\"><\/div><p class=\"muted\" style=\"font-size:12px\">بر اساس معاملات بسته‌شده امروز و تاریخ محلی مرورگر محاسبه می‌شود.<\/p><\/div><\/div>\n <\/section>\n <section id=\"analytics\" class=\"section\"><div class=\"cards\" id=\"analyticsMetrics\"><\/div><div class=\"grid2\"><div class=\"panel\"><h3>عملکرد بر اساس نماد<\/h3><div id=\"symbolStats\"><\/div><\/div><div class=\"panel\"><h3>عملکرد بر اساس سشن<\/h3><div id=\"sessionStats\"><\/div><\/div><\/div><div class=\"panel\"><h3>بهترین و ضعیف‌ترین معامله<\/h3><div id=\"bestWorst\"><\/div><\/div><\/section>\n <section id=\"calendar\" class=\"section\"><div class=\"toolbar\"><button onclick=\"changeMonth(-1)\">‹<\/button><strong id=\"monthLabel\" style=\"padding:10px\"><\/strong><button onclick=\"changeMonth(1)\">›<\/button><\/div><div class=\"panel\"><div class=\"calendar\" id=\"calendarGrid\"><\/div><\/div><div class=\"panel\" style=\"margin-top:14px\"><h3>یادداشت روزانه<\/h3><div class=\"field\"><label>یادداشت<\/label><textarea id=\"dayNote\" placeholder=\"برنامه، احساسات، اشتباهات و نکات روز...\"><\/textarea><\/div><button class=\"primary\" onclick=\"saveNote()\" style=\"margin-top:10px\">ذخیره یادداشت<\/button><span id=\"noteSaved\" class=\"muted\"><\/span><\/div><\/section>\n <section id=\"settings\" class=\"section\"><div class=\"panel\" style=\"max-width:650px\"><h3>تنظیمات برنامه<\/h3><div class=\"fieldgrid\"><div class=\"field\"><label>Language / زبان<\/label><select id=\"language\" onchange=\"setLanguage(this.value)\"><option value=\"fa\">فارسی<\/option><option value=\"en\">English<\/option><\/select><\/div><div class=\"field\"><label>Base currency<\/label><select id=\"currency\"><option>USD<\/option><option>EUR<\/option><option>GBP<\/option><option>JPY<\/option><option>IRR<\/option><\/select><\/div><div class=\"field\"><label>Starting balance<\/label><input id=\"startingBalance\" type=\"number\" value=\"10000\"><\/div><div class=\"field\"><label>Timezone<\/label><select id=\"timezone\"><option value=\"local\">Browser local time<\/option><option value=\"UTC\">UTC<\/option><\/select><\/div><\/div><button class=\"primary\" onclick=\"saveSettings()\" style=\"margin-top:14px\">ذخیره تنظیمات<\/button><hr style=\"border-color:var(--line);margin:20px 0\"><h3>مدیریت داده‌ها<\/h3><p class=\"muted\">اطلاعات این نسخه در حافظه مرورگر (Local Storage) ذخیره می‌شود.<\/p><button class=\"danger\" onclick=\"clearData()\">حذف همه داده‌ها<\/button><\/div><\/section>\n<\/main><\/div>\n<div class=\"modal\" id=\"tradeModal\"><div class=\"dialog\"><div class=\"dialoghead\"><h2 id=\"modalTitle\">ثبت معامله<\/h2><button onclick=\"closeTrade()\">✕<\/button><\/div>\n<form id=\"tradeForm\" onsubmit=\"saveTrade(event)\"><input type=\"hidden\" id=\"tradeId\"><div class=\"fieldgrid\">\n <div class=\"field\"><label>Symbol<\/label><input id=\"symbol\" required placeholder=\"EURUSD / XAUUSD\"><\/div>\n <div class=\"field\"><label>Side<\/label><select id=\"side\"><option>Buy<\/option><option>Sell<\/option><\/select><\/div>\n <div class=\"field\"><label>Status<\/label><select id=\"status\"><option>Closed<\/option><option>Open<\/option><\/select><\/div>\n <div class=\"field\"><label>Entry Price<\/label><input id=\"entry\" type=\"number\" step=\"any\" required><\/div>\n <div class=\"field\"><label>Exit Price<\/label><input id=\"exit\" type=\"number\" step=\"any\"><\/div>\n <div class=\"field\"><label>Lot Size<\/label><input id=\"lots\" type=\"number\" step=\".01\" value=\".10\" required><\/div>\n <div class=\"field\"><label>Pip Size (e.g. 0.0001)<\/label><input id=\"pipSize\" type=\"number\" step=\"any\" value=\".0001\"><\/div>\n <div class=\"field\"><label>Pip Value / lot (account currency)<\/label><input id=\"pipValue\" type=\"number\" step=\"any\" value=\"10\"><\/div>\n <div class=\"field\"><label>Commission (total)<\/label><input id=\"commission\" type=\"number\" step=\"any\" value=\"0\"><\/div>\n <div class=\"field\"><label>Swap (total)<\/label><input id=\"swap\" type=\"number\" step=\"any\" value=\"0\"><\/div>\n <div class=\"field\"><label>Spread cost (total)<\/label><input id=\"spread\" type=\"number\" step=\"any\" value=\"0\"><\/div>\n <div class=\"field\"><label>Slippage cost (total)<\/label><input id=\"slippage\" type=\"number\" step=\"any\" value=\"0\"><\/div>\n <div class=\"field\"><label>Stop Loss<\/label><input id=\"sl\" type=\"number\" step=\"any\"><\/div>\n <div class=\"field\"><label>Take Profit<\/label><input id=\"tp\" type=\"number\" step=\"any\"><\/div>\n <div class=\"field\"><label>Risk (%)<\/label><input id=\"riskPct\" type=\"number\" step=\".1\" value=\"1\"><\/div>\n <div class=\"field\"><label>Session<\/label><select id=\"session\"><option>Asian<\/option><option>London<\/option><option>New York<\/option><option>London/NY Overlap<\/option><\/select><\/div>\n <div class=\"field\"><label>Timeframe<\/label><select id=\"timeframe\"><option>M1<\/option><option>M5<\/option><option>M15<\/option><option>M30<\/option><option>H1<\/option><option>H4<\/option><option>D1<\/option><option>W1<\/option><\/select><\/div>\n <div class=\"field\"><label>Entry Date & Time<\/label><input id=\"entryDate\" type=\"datetime-local\" required><\/div>\n <div class=\"field\"><label>Exit Date & Time<\/label><input id=\"exitDate\" type=\"datetime-local\"><\/div>\n <div class=\"field\"><label>Strategy<\/label><input id=\"strategy\" placeholder=\"Breakout, SMC...\"><\/div>\n <div class=\"field\"><label>Entry emotion<\/label><select id=\"emotion\"><option>Calm<\/option><option>Fear<\/option><option>Greed<\/option><option>Stress<\/option><option>FOMO<\/option><\/select><\/div>\n <div class=\"field\"><label>Plan followed?<\/label><select id=\"plan\"><option value=\"yes\">Yes<\/option><option value=\"no\">No<\/option><\/select><\/div>\n <div class=\"field\"><label>Notes / Reason<\/label><textarea id=\"notes\"><\/textarea><\/div>\n <\/div><div class=\"formactions\"><button type=\"button\" onclick=\"closeTrade()\">انصراف<\/button><button class=\"primary\" type=\"submit\">ذخیره معامله<\/button><\/div><\/form><\/div><\/div>\n<script>\nconst $=id=>document.getElementById(id);\nlet trades=JSON.parse(localStorage.getItem('fjp_trades')||'[]'), settings=JSON.parse(localStorage.getItem('fjp_settings')||'{}'), notes=JSON.parse(localStorage.getItem('fjp_notes')||'{}');\nlet calDate=new Date(), selectedDay=new Date().toISOString().slice(0,10);\nconst fmt=n=>(Number(n)||0).toLocaleString(settings.language==='en'?'en-US':'fa-IR',{maximumFractionDigits:2});\nconst money=n=>(n<0?'-':'')+'$'+fmt(Math.abs(n));\nfunction saveAll(){localStorage.setItem('fjp_trades',JSON.stringify(trades));localStorage.setItem('fjp_settings',JSON.stringify(settings));localStorage.setItem('fjp_notes',JSON.stringify(notes))}\nfunction pnl(t){if(t.status==='Open'||t.exit===''||t.exit===null||t.exit===undefined)return 0;let diff=(+t.exit-(+t.entry))*(t.side==='Buy'?1:-1);let pips=diff/(+t.pipSize||.0001);return pips*(+t.pipValue||10)*(+t.lots||0)-(+t.commission||0)-(+t.spread||0)-(+t.slippage||0)+(+t.swap||0)}\nfunction closed(){return trades.filter(t=>t.status==='Closed'&&t.exit!==''&&t.exit!==null&&t.exit!==undefined)}\nfunction setPage(page){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===page));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let titles={dashboard:'داشبورد',trades:'ژورنال معاملات',risk:'مدیریت ریسک',analytics:'تحلیل عملکرد',calendar:'تقویم معاملاتی',settings:'تنظیمات'};$('pageTitle').textContent=titles[page];if(p =\"font-size:10px;margin-top:4px\">${detail}<\/div>\n  <\/div>`;\n }).join('');\n $('sessionCards').innerHTML=html;\n const overlap=active.includes('London')&&active.includes('New York');\n $('sessionOverlap').innerHTML=overlap\n  ?'⚡ <b>London / New York Overlap فعال است!<\/b> هر دو بازار لندن و نیویورک هم‌زمان باز هستند.'\n  :active.length?'سشن‌های باز: <b>'+active.join('، ')+'<\/b>' :'در حال حاضر هیچ‌یک از سشن‌های اصلی باز نیستند.';\n}\n\nfunction metric(label,value,cls=''){return `<div class=\"card\"><div class=\"metric-label\">${label}<\/div><div class=\"metric ${cls}\">${value}<\/div><\/div>`}\nfunction render(){renderDashboard();renderSessions();renderTrades();renderDailyRisk();if($('analytics').classList.contains('active'))renderAnalytics();if($('calendar').classList.contains('active'))renderCalendar()}\nfunction renderDashboard(){let c=closed(), wins=c.filter(t=>pnl(t)>0),loss=c.filter(t=>pnl(t)<0),gp=wins.reduce((a,t)=>a+pnl(t),0),gl=Math.abs(loss.reduce((a,t)=>a+pnl(t),0)),net=gp-gl,wr=c.length?wins.length/c.length*100:0,pf=gl?gp/gl:0,base=+(settings.startingBalance||10000),eq=base;let curve=[base];c.slice().sort((a,b)=>new Date(a.exitDate||a.entryDate)-new Date(b.exitDate||b.entryDate)).forEach(t=>{eq+=pnl(t);curve.push(eq)});let peak=base,dd=0;curve.forEach(x=>{peak=Math.max(peak,x);dd=Math.max(dd,(peak-x)/(peak||1)*100)});$('metrics').innerHTML=metric('Balance',money(base+net))+metric('Net PnL',money(net),net>=0?'positive':'negative')+metric('Win Rate',fmt(wr)+'%')+metric('Profit Factor',fmt(pf))+metric('Total Trades',c.length)+metric('Average R / Trade',fmt(c.length?c.reduce((a,t)=>a+(+t.riskPct||1)/100?0:0,0):0))+metric('Average Win',money(wins.length?gp/wins.length:0),'positive')+metric('Max Drawdown',fmt(dd)+'%','negative');drawLine($('equityChart'),curve);drawDonut($('winChart'),wins.length,loss.length);$('winLegend').innerHTML=`<span class=\"positive\">● ${wins.length} برد<\/span><span class=\"negative\">● ${loss.length} باخت<\/span>`;let recent= t),pip=t.status==='Open'?'—':((+t.exit-(+t.entry))*(t.side==='Buy'?1:-1))/(+t.pipSize||.0001);return `<tr><td data-label=\"تاریخ\">${(t.entryDate||'').replace('T',' ')}<\/td><td data-label=\"نماد\"><b>${esc(t.symbol)}<\/b><\/td><td data-label=\"جهت\"><span class=\"pill\">${t.side}<\/span><\/td><td data-label=\"وضعیت\">${t.status}<\/td><td data-label=\"ورود\">${t.entry}<\/td><td data-label=\"خروج\">${t.exit||'—'}<\/td><td data-label=\"لات\">${t.lots}<\/td><td data-label=\"Pips\">${fmt(pip)}<\/td><td data-label=\"Net PnL\" class=\"${p>=0?'positive':'negative'}\">${t.status==='Open'?'—':money(p)}<\/td>${actions?`<td><button class=\"smallbtn\" onclick=\"editTrade('${t.id}')\">ویرایش<\/button> <button class=\"smallbtn danger\" onclick=\"deleteTrade('${t.id}')\">حذف<\/button><\/td>`:''}<\/tr>`}).join('')}<\/tbody><\/table><\/div>`}\nfunction esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction renderTrades(){let q=($('searchTrade').value||'').toLowerCase(),side=$('filterSide').value,status=$('filterStatus').value,from=$('fromDate').value,to=$('toDate').value;let arr=trades.filter(t=>(!q||(t.symbol+' '+t.strategy).toLowerCase().includes(q))&&(!side||t.side===side)&&(!status||t.status===status)&&(!from||(t.entryDate||'')>=from)&&(!to||(t.entryDate||'')<=to+'T23:59'));$('tradesTable').innerHTML=tableHTML(arr)}\nfunction openTrade(t){$('tradeForm').reset();$('tradeId').value='';$('tradeModal').classList.add('open');$('entryDate').value=new Date().toISOString().slice(0,16);$('modalTitle').textContent='ثبت معامله جدید';if(t){$('modalTitle').textContent='ویرایش معامله';Object.keys(t).forEach(k=>{if($(k))$(k).value=t[k]??''});$('tradeId').value=t.id}}\nfunction closeTrade(){$('tradeModal').classList.remove('open')}\nfunction saveTrade(e){e.preventDefault();let ids=['symbol','side','status','entry','exit','lots','pipSize','pipValue','commission','swap','spread','slippage','sl','tp','riskPct','session',' <script>
(function(){
  var pages={};
  try{pages=JSON.parse(document.getElementById('pages').textContent)}catch(e){}
  var viewer=document.getElementById('viewer'),frame=document.getElementById('frame');
  function show(){
    var h=(location.hash||'').replace('#','');
    if(pages[h]){
      if(frame.dataset.page!==h){frame.srcdoc=pages[h];frame.dataset.page=h}
      viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');
    }else{
      viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');
      frame.removeAttribute('srcdoc');delete frame.dataset.page;
    }
  }
  function open(n){location.hash=n}
  document.querySelectorAll('[data-page]').forEach(function(c){
    c.addEventListener('click',function(){open(c.dataset.page)});
    c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(c.dataset.page)}});
  });
  document.getElementById('back').addEventListener('click',function(){
    if(history.length>1&&location.hash){history.back()}else{location.hash=''}
    setTimeout(function(){if(location.hash){location.hash=''}},150);
  });
  window.addEventListener('hashchange',show);show();
})();
</script>

  var fm={};
  function parts(z,d){var f=fm[z]||(fm[z]=new Intl.DateTimeFormat('en-US',{timeZone:z,hour:'2-digit',minute:'2-digit',weekday:'short',hourCycle:'h23'}));var o={};f.formatToParts(d).forEach(function(x){o[x.type]=x.value});return o}
  function open(s,d){var q=parts(s.z,d),h=+q.hour+ +q.minute/60;return q.weekday!=='Sat'&&q.weekday!=='Sun'&&h>=s.o&&h<s.c}
  function until(s,d,st){for(var m=1;m<=4320;m++){if(open(s,new Date(d.getTime()+m*60000))!==st)return m}return 0}
  function fmt(m){var h=Math.floor(m/60),r=m%60;return h?h+'h '+r+'m':r+'m'}
  function sessions(){
    var d=new Date(),box=document.getElementById('sess'),on=[];box.textContent='';
    S.forEach(function(s){
      var st=open(s,d),q=parts(s.z,d),m=until(s,d,st);if(st)on.push(s.n);
      var r=document.createElement('div');r.className='srow';
      var a=document.createElement('b');a.textContent=s.n;
      var t=document.createElement('time');t.textContent=q.hour+':'+q.minute;
      var b=document.createElement('span');b.className='badge'+(st?' on':'');b.textContent=st?'Open':'Closed';
      var c=document.createElement('small');c.textContent=m?((st?'closes in ':'opens in ')+fmt(m)):'';
      r.append(a,t,b,c);box.appendChild(r);
    });
    document.getElementById('sum').textContent=on.length?'Open now: '+on.join(', '):'All sessions closed';
  }
  sessions();setInterval(sessions,30000);
  function tick(){
    var d=new Date(),f={hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'};
    document.getElementById('clock').textContent='Your time '+d.toLocaleTimeString([], f)+'  \u2022  New York '+d.toLocaleTimeString([], Object.assign({timeZone:'America/New_York'},f));
  }
  tick();setInterval(tick,1000);

  function news(){
    var n=document.getElementById('news'),note=document.getElementById('nnote');
    fetch('https://nfs.faireconomy.media/ff_calendar_thisweek.json')
      .then(function(r){return r.json()})
      .then(function(list){
        var now=Date.now(),items=list.filter(function(e){return e.impact==='High'&&new Date(e.date).getTime()>now-3600000}).slice(0,6);
        note.textContent=items.length?'Upcoming high-impact events (your local time).':'No more high-impact events this week.';
        items.forEach(function(e){
          var r=document.createElement('div');r.className='nrow';
          r.textContent=e.country+' \u2022 '+e.title;
          var s=document.createElement('small');
          s.textContent=new Date(e.date).toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'})+(e.forecast?' \u2022 forecast '+e.forecast:'')+(e.previous?' \u2022 previous '+e.previous:'');
          r.appendChild(s);n.appendChild(r);
        });
      })
      .catch(function(){
        note.textContent='';
        var a=document.createElement('a');a.href='https://www.forexfactory.com/calendar';a.target='_blank';a.rel='noopener';
        a.textContent='News feed is blocked in this view. Open the economic calendar.';
        note.appendChild(a);
      });
  }
  news();
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
